<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>List a book — LeafLoop</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">leaf<span>loop</span></a><nav class="site-nav"><a href="index.html">Home</a><a href="browse.html">Browse</a><a class="active" href="list-book.html">List a book</a><a href="swaps.html">My swaps</a><a href="profile.html">Profile</a></nav></header><main><p class="eyebrow">Give it another chapter</p><h1>List a book.</h1><div class="form-panel list-form"><p>Tell the community about a book you are ready to pass on. You can decide what you would like to receive in return.</p><form action="#" method="post"><label for="title">Book title</label><input id="title" type="text" placeholder="e.g. The Song of Achilles" required><label for="author">Author</label><input id="author" type="text" placeholder="Author name" required><label for="book-condition">Condition</label><select id="book-condition"><option>Like new</option><option>Good</option><option>Well read</option></select><label for="wanted">What would you like to swap for?</label><input id="wanted" type="text" placeholder="Genre, title, or 'open to offers'"><label for="note">A note for readers</label><textarea id="note" rows="5" placeholder="Share anything useful about the book."></textarea><button class="button" type="submit">Publish listing</button></form></div></main><footer class="site-footer"><span>© 2026 LeafLoop</span><span>Made for readers, not algorithms.</span></footer></body></html>
