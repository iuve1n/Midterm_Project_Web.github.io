<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse books offered by LeafLoop readers in Astana.">
  <title>Browse books | LeafLoop</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css?v=profile-favorites">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="site-header navbar navbar-expand-lg">
    <div class="container-fluid px-0">
      <a class="brand navbar-brand" href="index.html">leaf<span>loop</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" aria-controls="main-navigation" aria-expanded="false" aria-label="Open navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <nav class="collapse navbar-collapse" id="main-navigation" aria-label="Main navigation">
        <ul class="site-nav navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="browse.html" aria-current="page">Browse</a></li>
          <li class="nav-item"><a class="nav-link" href="list-book.html">List a book</a></li>
          <li class="nav-item"><a class="nav-link" href="swaps.html">My swaps</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" id="main-content">
    <p class="eyebrow">The community shelf</p>
    <h1>Find your next read.</h1>

    <div class="filter-bar row g-4 mt-2">
      <aside class="filter-panel col-lg-3" aria-labelledby="filter-title">
        <h2 id="filter-title">Filter books</h2>
        <label for="search">Search</label>
        <input class="form-control" id="search" name="search" type="search" placeholder="Title or author">

        <label for="genre">Genre</label>
        <select class="form-select" id="genre" name="genre">
          <option value="all">All genres</option>
          <option value="Fiction">Fiction</option>
          <option value="Non-fiction">Non-fiction</option>
          <option value="Fantasy">Fantasy</option>
        </select>

        <label for="condition">Condition</label>
        <select class="form-select" id="condition" name="condition">
          <option value="all">Any condition</option>
          <option value="Like new">Like new</option>
          <option value="Good">Good</option>
          <option value="Well read">Well read</option>
        </select>
      </aside>

      <section class="col-lg-9 mt-0" aria-label="Available books">
        <p id="book-results" class="form-note" aria-live="polite"></p>
        <p id="favorite-message" class="field-error" role="status"></p>
        <div class="book-grid mt-0" id="book-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer container-fluid">
    <span>© 2026 LeafLoop</span>
    <span>Helping Astana readers exchange books locally.</span>
  </footer>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
